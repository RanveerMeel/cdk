name: Build and Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # rust-toolchain.toml pins nightly + rust-src/llvm-tools and the bare-metal target;
      # rustup installs them on first cargo invocation.
      - name: Install toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build kernel (debug)
        run: cargo build

      - name: Build kernel (release)
        run: cargo build --release --bin cdk

      - name: Check virtio-hw feature
        run: cargo check --features virtio-hw

      - name: Host unit tests
        run: cargo test-host

      - name: User programs and ramdisk
        run: tools/build_user_programs.sh

      - name: Inference runtime tests
        run: cd user/ml && cargo test --target x86_64-unknown-linux-gnu

      - name: Link protocol tests
        run: cd link && cargo test --target x86_64-unknown-linux-gnu --lib

      # NIST ACVP known-answer tests (roadmap 1.5): pinned, SHA-256-checked
      # vectors; a missing file fails the build.
      - name: Cache NIST ACVP vectors
        uses: actions/cache@v4
        with:
          path: ~/acvp
          key: acvp-${{ hashFiles('tools/fetch_acvp_vectors.sh') }}

      - name: Kernel and tests use the same crypto crates
        run: tools/check_crypto_versions.sh

      - name: NIST ACVP vectors (ML-DSA-65, ML-KEM-768, Ed25519, SHA-256)
        env:
          CDK_ACVP_REQUIRED: "1"
          RUSTFLAGS: --cfg curve25519_dalek_backend="serial"
        run: |
          export CDK_ACVP_DIR="$HOME/acvp"
          tools/fetch_acvp_vectors.sh
          cd link && cargo test --target x86_64-unknown-linux-gnu --test acvp -- --nocapture

      - name: Host gateway tests (runs the demo MCP server)
        run: cd gateway && cargo test --target x86_64-unknown-linux-gnu

      - name: Demo MCP and model servers compile
        run: python3 -m py_compile gateway/examples/demo_mcp_server.py gateway/examples/demo_model_server.py

      - name: Demo model is reproducible
        run: python3 tools/train_demo_model.py && git diff --exit-code user/models

  # Roadmap 4.3: replay every seed and past crash, then fuzz each parser of
  # untrusted bytes briefly. Long campaigns run locally (tools/fuzz.sh).
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup show

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'link/Cargo.lock') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --locked

      - name: Replay seeds and regressions
        run: tools/fuzz.sh --replay

      - name: Fuzz each target for 30 seconds
        run: tools/fuzz.sh 30

      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
