# User programs run in CDK's ring 3 at fixed addresses inside the user region
# (PML4 slot 1, 512 GiB and up). Build them as static, non-PIE executables
# (ET_EXEC) so the kernel loader maps segments exactly where they were linked
# and never has to apply relocations. The `large` code model is required
# because the default `small` model assumes everything lives below 2 GiB.
#
# Roadmap 2.6: agents have their own FPU/SSE/AVX state, so they are built for
# x86_64-cdk-user.json — the bare-metal target with hardware floating point
# (SSE2 baseline; AVX via #[target_feature] and runtime detection). `core`
# and `alloc` must be built from source for it: tools/build_user_programs.sh
# passes -Zbuild-std. It is not set here, because this config also applies
# to user/ml, whose host tests need the prebuilt `core` that `std` uses.
[build]
target = "x86_64-cdk-user.json"

[target.x86_64-cdk-user]
rustflags = ["-C", "relocation-model=static", "-C", "code-model=large"]

[unstable]
json-target-spec = true
