[package]
name = "cdk-gateway"
version = "0.1.0"
edition = "2021"
description = "Host-side gateway for the CDK link (runs on Linux next to the CDK VM)"
license = "Apache-2.0"
publish = false

[dependencies]
cdk-link = { path = "../link" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["tls"] }
zeroize = "1"

[profile.dev.package.ml-kem]
opt-level = 3
[profile.dev.package.ml-dsa]
opt-level = 3
