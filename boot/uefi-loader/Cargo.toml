# Forked from the published bootloader-x86_64-uefi 0.11.17 (normalized by cargo).
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
name = "cdk-uefi-loader"
version = "0.11.17"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "CDK's measuring UEFI loader: bootloader-x86_64-uefi 0.11.17 (rust-osdev) plus TPM measurement of the kernel and ramdisk"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rust-osdev/bootloader"

[[bin]]
name = "cdk-uefi-loader"
path = "src/main.rs"

[dependencies.bootloader-boot-config]
version = "0.11.17"

[dependencies.bootloader-x86_64-common]
version = "0.11.17"

[dependencies.bootloader_api]
version = "0.11.17"

[dependencies.log]
version = "0.4.14"

[dependencies.serde-json-core]
version = "0.5.0"

[dependencies.uefi]
version = "0.38.0"

[dependencies.x86_64]
version = "0.15.2"

# CDK: SHA-256 of the kernel file, checked against the pinned digest.
[dependencies.sha2]
version = "0.10"
default-features = false
